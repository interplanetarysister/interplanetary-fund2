name: NotificationBell Contract

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'recovery/**'

permissions:
  contents: read

concurrency:
  group: notificationbell-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notificationbell-contract:
    name: NotificationBell runtime contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Verify Node 22 runtime
        run: npm run verify:runtime-node22

      - name: Verify NotificationBell runtime contract
        run: node scripts/verify-notificationbell-runtime-contract.mjs
