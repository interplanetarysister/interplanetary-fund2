name: Deploy Cloudflare

on:
  workflow_run:
    workflows: ["Production Quality Gates"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    environment: production_if2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Build canonical frontend
        env:
          VITE_BASE44_APP_ID: ${{ vars.VITE_BASE44_APP_ID || '6a67a778342a8fe05ee79cba' }}
          VITE_BASE44_APP_BASE_URL: ${{ vars.VITE_BASE44_APP_BASE_URL || 'https://interplanetaryfund.base44.app' }}
          VITE_ADMIN_AGENT_API_URL: ${{ vars.VITE_ADMIN_AGENT_API_URL || 'https://interplanetaryfund.com' }}
        run: |
          test -n "$VITE_BASE44_APP_ID"
          test -n "$VITE_BASE44_APP_BASE_URL"
          test -n "$VITE_ADMIN_AGENT_API_URL"
          npm run build
      - name: Deploy frontend and compute runtime to Cloudflare Workers
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4 deploy | tee /tmp/wrangler-deploy.log
          DEPLOYMENT_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -1)"
          test -n "$DEPLOYMENT_URL"
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
      - name: Verify deployed Worker serves exact validated build
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test -n "$DEPLOYMENT_URL"
          test -n "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          curl --fail --silent --show-error --retry 4 --retry-delay 3 "$DEPLOYMENT_URL/" -o /tmp/ifund-cloudflare.html
          grep -q 'id="root"' /tmp/ifund-cloudflare.html
          grep -q 'https://interplanetaryfund.com/' /tmp/ifund-cloudflare.html
          curl --fail --silent --show-error --retry 4 --retry-delay 3 https://interplanetaryfund.com/ -o /tmp/ifund-custom-domain.html
          grep -q 'id="root"' /tmp/ifund-custom-domain.html
