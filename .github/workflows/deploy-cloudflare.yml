name: Deploy Cloudflare

on:
  workflow_run:
    workflows: ["Production Quality Gates"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Build canonical frontend
        env:
          VITE_BASE44_APP_ID: ${{ vars.VITE_BASE44_APP_ID }}
          VITE_BASE44_APP_BASE_URL: ${{ vars.VITE_BASE44_APP_BASE_URL }}
          VITE_ADMIN_AGENT_API_URL: ${{ vars.VITE_ADMIN_AGENT_API_URL }}
        run: npm run build
      - name: Deploy static frontend to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
