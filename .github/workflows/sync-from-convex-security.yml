name: Sync From Convex Security Verification

on:
  pull_request:
    paths:
      - 'base44/functions/syncFromConvex/**'
      - 'scripts/verify-sync-from-convex-security.mjs'
      - '.github/workflows/sync-from-convex-security.yml'
  push:
    branches: [main]
    paths:
      - 'base44/functions/syncFromConvex/**'
      - 'scripts/verify-sync-from-convex-security.mjs'
      - '.github/workflows/sync-from-convex-security.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify syncFromConvex security contract
        run: node scripts/verify-sync-from-convex-security.mjs
