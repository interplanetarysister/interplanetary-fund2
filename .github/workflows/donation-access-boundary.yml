name: Donation Access Boundary

on:
  pull_request:
    branches: [main]
    paths:
      - 'base44/entities/Donation.jsonc'
      - 'base44/functions/getCampaignDonationView/**'
      - 'src/pages/Analytics.jsx'
      - 'src/pages/CampaignDetail.jsx'
      - 'src/pages/Inbox.jsx'
      - 'scripts/verify-donation-access-boundary.mjs'
      - '.github/workflows/donation-access-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'base44/entities/Donation.jsonc'
      - 'base44/functions/getCampaignDonationView/**'
      - 'src/pages/Analytics.jsx'
      - 'src/pages/CampaignDetail.jsx'
      - 'src/pages/Inbox.jsx'
      - 'scripts/verify-donation-access-boundary.mjs'
      - '.github/workflows/donation-access-boundary.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/verify-donation-access-boundary.mjs
      - run: npm run lint
      - run: npm run build
