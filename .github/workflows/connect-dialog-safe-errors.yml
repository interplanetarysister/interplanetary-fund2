name: Connection Authorization and Data Truth

on:
  workflow_dispatch:
  # A completed batch is submitted by marking its draft PR ready for review.
  pull_request:
    types: [ready_for_review]
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Dependency-free targeted check; Production Quality Gates owns npm install,
      # lint, and build. Avoid repeating a complete build in this lane.
      - run: node scripts/verify-connect-dialog-safe-errors.mjs
