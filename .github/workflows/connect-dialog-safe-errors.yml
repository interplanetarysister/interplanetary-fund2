name: Connection Authorization and Data Truth

on:
  pull_request:
    paths:
      - 'src/components/connections/ConnectDialog.jsx'
      - 'src/components/connections/ConnectionCard.jsx'
      - 'src/components/campaigns/CrossPlatformTotals.jsx'
      - 'src/components/admin/**'
      - 'src/lib/externalAccounts.js'
      - 'src/pages/Connections.jsx'
      - 'base44/functions/saveConnectionCredentials/entry.ts'
      - 'base44/functions/kofiWebhook/entry.ts'
      - 'base44/functions/syncExternalFunds/entry.ts'
      - 'base44/functions/publishPost/entry.ts'
      - 'base44/functions/broadcastPosts/entry.ts'
      - 'base44/functions/postCampaignUpdate/entry.ts'
      - 'base44/functions/syncConnections/entry.ts'
      - 'base44/entities/PlatformConnection.jsonc'
      - 'base44/entities/SyncRun.jsonc'
      - 'scripts/verify-connect-dialog-safe-errors.mjs'
      - '.github/workflows/connect-dialog-safe-errors.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - run: node scripts/verify-connect-dialog-safe-errors.mjs
      - run: npm run build
