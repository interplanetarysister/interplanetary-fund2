name: Message Audit Security

on:
  pull_request:
    paths:
      - 'base44/entities/Message.jsonc'
      - 'base44/functions/sendCommunication/entry.ts'
      - 'scripts/verify-message-audit-contract.mjs'
      - '.github/workflows/message-audit.yml'
  push:
    branches: [main]
    paths:
      - 'base44/entities/Message.jsonc'
      - 'base44/functions/sendCommunication/entry.ts'
      - 'scripts/verify-message-audit-contract.mjs'
      - '.github/workflows/message-audit.yml'

jobs:
  verify-message-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify:message-audit
