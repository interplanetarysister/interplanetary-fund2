name: Terms Liability Verification

on:
  workflow_dispatch:
  # Manual batch verification only; no automatic PR or main push trigger.

jobs:
  verify-terms-liability:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'node'

      - name: Verify opening-agreement liability contract
        run: node scripts/verify-terms-liability.mjs
