name: Terms Liability Verification

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/verify-terms-liability.mjs"
      - ".github/workflows/terms-liability.yml"
  push:
    branches:
      - main
      - "agent1/terms-liability-verification-clean"

jobs:
  verify-terms-liability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify opening-agreement liability contract
        run: node scripts/verify-terms-liability.mjs
