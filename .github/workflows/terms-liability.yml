name: Terms Liability Verification

# Automatic Actions triggers paused on 2026-10-13 at user's request.
# Manual workflow_dispatch remains available; no job or implementation changes.
on:
  workflow_dispatch:

jobs:
  verify-terms-liability:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'node'

      - name: Verify opening-agreement liability contract
        run: node scripts/verify-terms-liability.mjs
