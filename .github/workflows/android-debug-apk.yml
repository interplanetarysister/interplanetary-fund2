name: IFund Android APK - manual build

# Intentional Android packaging only. Never add push, pull_request, schedule,
# workflow_run, or other automatic triggers. Web/PR CI does not depend on this.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK variant (release requires existing signing identity)'
        required: true
        type: choice
        default: debug
        options:
          - debug
          - signed-release
      version_code:
        description: 'For signed-release: integer greater than the installed APK versionCode'
        required: false
        type: string
      version_name:
        description: 'For signed-release: e.g. 1.0.1'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ifund-android-manual
  cancel-in-progress: false

jobs:
  android-apk:
    name: Build Android APK (manual)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout intended IFund source
        uses: actions/checkout@v4

      - name: Validate release parameters and signing availability
        if: ${{ inputs.build_type == 'signed-release' }}
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          KEYSTORE_B64: ${{ secrets.IFUND_ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.IFUND_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.IFUND_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.IFUND_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Signed releases are only allowed from reviewed main. Use debug for testing other branches."; exit 1; }
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Enter an integer release versionCode greater than the installed APK versionCode."; exit 1; }
          [[ "$VERSION_NAME" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "::error::Enter a release versionName such as 1.0.1."; exit 1; }
          for secret in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!secret}" ]] || { echo "::error::A release signing secret is missing: $secret"; exit 1; }
          done
          echo "Release inputs are present. Signing key identity must match the installed APK to allow updates."

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}" || { echo 'Android SDK unavailable'; exit 1; }
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Verify payments and legal contracts
        run: |
          node scripts/verify-public-legal-help-and-platform-support.mjs
          node scripts/verify-paypal-business-account-contract.mjs
          node scripts/verify-paypal-checkout-contract.mjs
          node scripts/test-paypal-financial-recovery.mjs
          node scripts/test-financial-integrity.mjs

      - name: Build shared frontend
        run: npm run build

      - name: Sync Android from this exact frontend
        run: npx cap sync android

      - name: Verify native configuration and frontend asset parity
        run: node scripts/verify-android-firebase.mjs

      - name: Build debug APK
        if: ${{ inputs.build_type == 'debug' }}
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Build and sign release APK with existing owner key
        if: ${{ inputs.build_type == 'signed-release' }}
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          KEYSTORE_B64: ${{ secrets.IFUND_ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.IFUND_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.IFUND_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.IFUND_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          (cd android && ./gradlew :app:assembleRelease -PifundVersionCode="$VERSION_CODE" -PifundVersionName="$VERSION_NAME" --no-daemon --console=plain)
          input="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$input" || { echo "::error::Unsigned release APK not produced."; exit 1; }
          keyfile="$RUNNER_TEMP/ifund-existing-signing.jks"
          aligned="$RUNNER_TEMP/ifund-aligned.apk"
          output="android/app/build/outputs/apk/release/ifund-release-signed.apk"
          trap 'rm -f "$keyfile" "$aligned"' EXIT
          (umask 077; printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keyfile")
          test -s "$keyfile" || { echo "::error::Signing keystore could not be loaded."; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$input" "$aligned"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$keyfile" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "$output" "$aligned"
          test -s "$output"

      - name: Verify signature and embedded release marker
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_TYPE" == "debug" ]]; then
            apk="android/app/build/outputs/apk/debug/app-debug.apk"
          else
            apk="android/app/build/outputs/apk/release/ifund-release-signed.apk"
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify -v "$apk"
          APK_PATH="$apk" python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import zipfile

          path = Path(os.environ["APK_PATH"])
          with zipfile.ZipFile(path) as archive:
              embedded = archive.read("assets/public/ifund-release.json")
              assert embedded == Path("dist/ifund-release.json").read_bytes(), "APK/web assets have different release markers"
              assert json.loads(embedded).get("release_id"), "Missing release identifier"
              assert "assets/public/index.html" in archive.namelist(), "Missing app entrypoint"
          print("Android APK validated; size:", path.stat().st_size, "sha256:", hashlib.sha256(path.read_bytes()).hexdigest())
          PY

      - name: Upload requested APK artifact (not published to users)
        uses: actions/upload-artifact@v4
        with:
          name: IFund-Android-${{ inputs.build_type }}-${{ github.sha }}-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/ifund-release-signed.apk
          if-no-files-found: error
          retention-days: 7
