name: Build IFund Android debug APK

# Opt-in Android test package distribution; not a Google Play release.
# A one-time push trigger on this workflow makes the first artifact available.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-debug-ifund-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Verify and package Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout authoritative IFund source
        uses: actions/checkout@v4

      - name: Set up current supported Node (Node 20+ policy)
        uses: actions/setup-node@v4
        with:
          node-version: 'node'
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android 16 SDK using hosted runner tools
        run: |
          test -n "${ANDROID_HOME:-}" || { echo 'Android SDK unavailable on runner'; exit 1; }
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Verify money and legal contracts
        run: |
          node scripts/verify-public-legal-help-and-platform-support.mjs
          node scripts/verify-paypal-business-account-contract.mjs
          node scripts/verify-paypal-checkout-contract.mjs
          node scripts/test-paypal-financial-recovery.mjs
          node scripts/test-financial-integrity.mjs

      - name: Build shared website assets
        run: npm run build

      - name: Sync native Android plugins and exact website assets
        run: npx cap sync android

      - name: Confirm Android bundle parity and Firebase configuration
        run: node scripts/verify-android-firebase.mjs

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Verify debug APK signature and release marker
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify -v android/app/build/outputs/apk/debug/app-debug.apk
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, json, hashlib
          p = Path('android/app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(p) as archive:
              embedded = archive.read('assets/public/ifund-release.json')
              assert embedded == Path('dist/ifund-release.json').read_bytes()
              assert json.loads(embedded)['release_id'] == 'ifund-20261015-gift-first-donations-platform-tip-v5'
              names = archive.namelist()
              assert 'assets/public/index.html' in names
              assert any(name.startswith('assets/public/assets/LegalFooter-') and name.endswith('.js') for name in names)
          print('Verified Android debug APK:', p.stat().st_size, 'bytes, sha256', hashlib.sha256(p.read_bytes()).hexdigest())
          PY

      - name: Upload APK for authenticated GitHub download
        uses: actions/upload-artifact@v4
        with:
          name: IFund-Android-Debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
