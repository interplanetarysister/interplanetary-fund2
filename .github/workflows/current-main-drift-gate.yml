name: Current Main Drift Gate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/current-main-drift-gate.yml"
      - "base44/**"
      - "convex/**"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/current-main-drift-gate.yml"
      - "base44/**"
      - "convex/**"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: current-main-drift-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REVIEWED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  base-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact reviewed head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEWED_SHA }}
          fetch-depth: 0
      - name: Confirm exact reviewed head
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$REVIEWED_SHA"
          printf 'Verified exact reviewed SHA: %s\n' "$actual_sha"
      - name: Fetch current main
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Require current-main ancestry for review evidence
        run: |
          current_main="$(git rev-parse refs/remotes/origin/main)"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base_sha="$(git rev-parse HEAD^2 2>/dev/null || true)"
            if [ -z "$base_sha" ]; then
              echo "The reviewed commit is not a merge commit; validating that origin/main is an ancestor of the reviewed head."
            fi
            if ! git merge-base --is-ancestor "$current_main" HEAD; then
              echo "Current-main drift detected: reviewed head is not based on origin/main at $current_main."
              echo "Rebuild/rebase the draft branch before treating CI as release evidence."
              exit 1
            fi
          fi
          printf 'Current main is an ancestor of the reviewed head: %s\n' "$current_main"
