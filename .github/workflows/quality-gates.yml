name: Production Quality Gates

on:
  push:
    branches:
      - main
      - 'recovery/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Verify canonical quality-gate verifier manifest
        run: node scripts/verify-quality-gate-verifier-manifest.mjs

      - name: Verify Node 22 release contract
        run: npm run verify:node22-release-contract

      - name: Test Node 22 release contract failure cases
        run: npm run test:node22-release-contract

      - name: Lint
        run: npm run lint

      - name: Analytics safety contract
        run: npm run verify:analytics-safety

      - name: Edit AI profile safe-error contract
        run: npm run verify:edit-ai-profile-safe-errors

      - name: Auth pages safe-diagnostics contract
        run: npm run verify:auth-pages-safe-diagnostics

      - name: Stripe webhook safe-error contract
        run: npm run verify:stripe-webhook-errors

      - name: Production build
        run: npm run build

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck
