name: Production Quality Gates

on:
  push:
    branches:
      - main
      - 'recovery/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Immutable commit SHA to validate during manual recovery'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_COMMIT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}

jobs:
  quality:
    name: Lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve candidate SHA
        shell: bash
        run: |
          if [[ ! "$EXPECTED_COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Candidate SHA is missing or malformed" >&2
            exit 1
          fi

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_COMMIT_SHA }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Assert exact candidate checkout
        run: npm run verify:exact-head-checkout

      - name: Verify Node 22 release contract
        run: npm run verify:node22-release-contract

      - name: Test Node 22 release contract failure cases
        run: npm run test:node22-release-contract

      - name: Lint
        run: npm run lint

      - name: Analytics safety contract
        run: npm run verify:analytics-safety

      - name: Edit AI profile safe-error contract
        run: npm run verify:edit-ai-profile-safe-errors

      - name: Production build
        run: npm run build

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve candidate SHA
        shell: bash
        run: |
          if [[ ! "$EXPECTED_COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Candidate SHA is missing or malformed" >&2
            exit 1
          fi

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_COMMIT_SHA }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Assert exact candidate checkout
        run: npm run verify:exact-head-checkout

      - name: Typecheck
        run: npm run typecheck
