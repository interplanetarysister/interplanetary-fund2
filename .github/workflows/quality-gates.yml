name: Production Quality Gates

on:
  push:
    branches:
      - main
      - 'recovery/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, deterministic contracts, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve candidate head
        id: candidate
        shell: bash
        run: |
          expected_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          if [[ ! "$expected_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Candidate SHA is missing or malformed: '$expected_sha'" >&2
            exit 1
          fi
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.expected_sha }}
          fetch-depth: 1

      - name: Assert exact candidate head
        shell: bash
        run: |
          expected_sha="${{ steps.candidate.outputs.expected_sha }}"
          actual_sha="$(git rev-parse HEAD)"
          printf 'Expected candidate SHA: %s\nChecked out SHA: %s\n' "$expected_sha" "$actual_sha"
          test "$actual_sha" = "$expected_sha"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Verify Node 22 release contract
        run: npm run verify:node22-release-contract

      - name: Lint
        run: npm run lint

      - name: Payment and financial contracts
        run: npm run test:payments

      - name: Stripe webhook error contract
        run: npm run verify:stripe-webhook-errors

      - name: Analytics safety contract
        run: npm run verify:analytics-safety

      - name: Edit AI profile safe-error contract
        run: npm run verify:edit-ai-profile-safe-errors

      - name: Production build
        run: npm run build

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve candidate head
        id: candidate
        shell: bash
        run: |
          expected_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          if [[ ! "$expected_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Candidate SHA is missing or malformed: '$expected_sha'" >&2
            exit 1
          fi
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.expected_sha }}
          fetch-depth: 1

      - name: Assert exact candidate head
        shell: bash
        run: |
          expected_sha="${{ steps.candidate.outputs.expected_sha }}"
          actual_sha="$(git rev-parse HEAD)"
          printf 'Expected candidate SHA: %s\nChecked out SHA: %s\n' "$expected_sha" "$actual_sha"
          test "$actual_sha" = "$expected_sha"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck
