name: Production Quality Gates

# Batch verification marker: 2026-09-30 repair batch

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'recovery/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.actor == 'base44-builder[bot]' || contains(github.event.head_commit.message, '[batch-check]') || contains(github.event.head_commit.message, '[release-check]')
    name: Node 20 Base44 compatibility build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies with lifecycle scripts
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Verify Node 22 runtime contract
        run: npm run verify:node22-release-contract

      - name: Test runtime contract failure cases
        run: npm run test:node22-release-contract

      - name: Verify runtime baseline reconciliation
        run: npm run verify:runtime-baseline-reconciliation

      - name: Test runtime baseline reconciliation failure cases
        run: npm run test:runtime-baseline-reconciliation

      - name: Verify shared text contrast and one-finger scroll contract
        run: node scripts/verify-text-contrast-contract.mjs

      - name: Verify route code splitting contract
        run: npm run verify:route-code-splitting

      - name: Verify Base44 sync contract
        run: node scripts/verify-base44-sync-contract.mjs

      - name: Lint
        run: npm run lint

      - name: Application startup and safe auth diagnostics
        run: npm run verify:auth-pages-safe-diagnostics

      - name: Analytics safety contract
        run: npm run verify:analytics-safety

      - name: Edit AI profile safe-error contract
        run: npm run verify:edit-ai-profile-safe-errors

      - name: Reject literal escaped newlines in JSX
        run: |
          if grep -RFn '\\n' src --include='*.jsx' --include='*.tsx'; then
            echo "Literal escaped newline found in JSX/TSX source."
            exit 1
          fi

      - name: Client error-disclosure contract
        run: node scripts/verify-client-error-disclosure.mjs

      - name: Server-authoritative sensitive mutation contract
        run: node scripts/verify-server-authoritative-mutations.mjs

      - name: Production custom-domain contract
        run: node scripts/verify-production-domain-contract.mjs

      - name: Donor-entered total payment contract
        run: node scripts/verify-donor-total-contract.mjs

      - name: Fraud-control financial authority contract
        run: node scripts/verify-fraud-control-financial-boundary.mjs

      - name: Connection authorization and data-truth contract
        run: node scripts/verify-connect-dialog-safe-errors.mjs

      - name: Subscription entitlement and canonical connection-health contract
        run: npm run verify:entitlements-connections

      - name: No active legacy Convex runtime
        run: npm run verify:no-active-convex

      - name: Server entitlement and connection OBO contract
        run: npm run verify:entitlement-obo

      - name: Connection lifecycle and operational health contract
        run: npm run verify:connection-lifecycle

      - name: Managed Connections authorization and delegation contract
        run: npm run verify:managed-connections

      - name: Connection catalog consistency contract
        run: node scripts/verify-connection-catalog-contract.mjs

      - name: Wix webhook ingestion contract
        run: node scripts/verify-wix-webhook-contract.mjs

      - name: Wix campaign synchronization contract
        run: node scripts/verify-wix-campaign-sync-contract.mjs

      - name: Wix data synchronization contracts
        run: node scripts/verify-wix-data-sync-contract.mjs

      - name: Wix Mission Control and replaceability contract
        run: node scripts/verify-wix-mission-control-contract.mjs

      - name: Wix shared web/mobile parity contract
        run: node scripts/verify-wix-parity-contract.mjs

      - name: Builder agent authorization boundary
        run: npm run verify:builder-agent-boundary

      - name: Host portability and shared data-plane contract
        run: npm run verify:host-portability

      - name: Cloudflare SPA and compute runtime contract
        run: node scripts/verify-cloudflare-runtime-contract.mjs

      - name: Cloudflare MCP proxy behavior
        run: node scripts/test-cloudflare-mcp-proxy.mjs

      - name: Canonical admin authorization contract
        run: npm run verify:admin-authorization

      - name: Agent reasoning coherence
        run: npm run verify:agent-reasoning-coherence

      - name: Payment and financial-integrity contracts
        run: npm run test:payments

      - name: PayPal campaign checkout contract
        run: node scripts/verify-paypal-checkout-contract.mjs

      - name: External fund migration authority contract
        run: node scripts/verify-external-fund-migration-contract.mjs

      - name: Google Pay provider response contract
        run: node scripts/verify-google-pay-contract.mjs

      - name: My Giving response safety contract
        run: node scripts/verify-my-giving-contract.mjs

      - name: Verify external fundraising network contract
        run: npm run verify:external-fund-network

      - name: Production build
        run: npm run build

      - name: Verify preview serves the app HTML
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/ifund-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ -o /tmp/ifund-render.html; then
              break
            fi
            if ! kill -0 $PREVIEW_PID 2>/dev/null; then
              cat /tmp/ifund-preview.log
              exit 1
            fi
            sleep 1
          done
          test -s /tmp/ifund-render.html || { cat /tmp/ifund-preview.log; exit 1; }
          grep -q '<div id="root"></div>' /tmp/ifund-render.html || { cat /tmp/ifund-render.html; exit 1; }

  node22-compatibility:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.actor == 'base44-builder[bot]' || contains(github.event.head_commit.message, '[batch-check]') || contains(github.event.head_commit.message, '[release-check]')
    name: Node 22 compatibility build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - run: npm run build

  typecheck:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.actor == 'base44-builder[bot]' || contains(github.event.head_commit.message, '[batch-check]') || contains(github.event.head_commit.message, '[release-check]')
    name: Typecheck on Base44 baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies with lifecycle scripts
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck
