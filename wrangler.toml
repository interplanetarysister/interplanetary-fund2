name = "interplanetary-fund2"
main = "host/gateway/worker.js"
compatibility_date = "2026-09-29"

[vars]
IFUND_BASE44_ORIGIN = "https://interplanetaryfund.base44.app"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/v1/admin/agents/*",
  "/api/mcp",
  "/api/mcp/*",
  "/api/apps/*/mcp",
  "/api/apps/*/mcp/*",
  "/.well-known/oauth-*"
]
